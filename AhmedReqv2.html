<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Hack4SaferPlates Screens</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="screen_one.png" />

<style>
  :root{
    --glow: 34,197,94;   /* #22c55e */
    --fade-dur: 800ms;   /* screen fade */
    --press-dur: 350ms;  /* press glow ramp */
    --easing: cubic-bezier(.4,0,.2,1);
  }

  /* Disable selection/tap highlight globally */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, .screen, .btn {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* Screens */
  .screen{
    position: fixed; inset: 0; background: #fff;
    opacity: 0; visibility: hidden;
    transition: opacity var(--fade-dur) var(--easing), visibility 0s linear var(--fade-dur);
  }
  .screen.active{
    opacity: 1; visibility: visible;
    transition: opacity var(--fade-dur) var(--easing);
  }
  body.crossfade{ pointer-events: none; }
  body.crossfade .screen{ visibility: visible; }

  /* Backgrounds */
  #screen1{ background: url('screen_1_NB.jpg') no-repeat center/cover; }
  #screen2{ background: url('screen_two.png') no-repeat center/cover; background-color:#fff; }

  /* Button: background image with glow */
  .btn{
    position: absolute; left: 50%; bottom: 15vh; transform: translateX(-50%) scale(1);
    width: 25vw; max-width: 200px; min-width: 100px;
    aspect-ratio: 1 / 1; /* adjust if not square */
    border-radius: 999px; cursor: pointer; z-index: 20;

    background: url('button.png') center / contain no-repeat;

    box-shadow: 0 0 18px 10px rgba(var(--glow), .35);
    animation: glowRest 1.6s ease-in-out infinite;
    transition: transform var(--press-dur) var(--easing),
                box-shadow var(--press-dur) var(--easing),
                filter var(--press-dur) var(--easing);
    will-change: transform, box-shadow, filter;
  }

  /* Rest breathing glow */
  @keyframes glowRest{
    0%   { box-shadow: 0 0 14px 8px  rgba(var(--glow), .28); }
    50%  { box-shadow: 0 0 28px 18px rgba(var(--glow), .55); }
    100% { box-shadow: 0 0 14px 8px  rgba(var(--glow), .28); }
  }

  /* Press stronger glow */
  .btn.transitioning{
    transform: translateX(-50%) scale(1.18);
    filter: saturate(1.08);
    animation: glowBoost var(--press-dur) ease-out forwards;
  }
  @keyframes glowBoost{
    0%   { box-shadow: 0 0 28px 18px rgba(var(--glow), .55); }
    100% { box-shadow: 0 0 90px 44px rgba(var(--glow), .95); }
  }

  /* Responsive */
  @media (max-width:1024px){
    .btn{ width: 35vw; max-width: 250px; min-width: 120px; bottom: 12vh; }
  }
  @media (prefers-reduced-motion: reduce){
    .btn{ animation: none; transition: none; }
    .screen, .screen.active{ transition: none; }
  }
</style>
</head>
<body>

<!-- Screen 1 with start button -->
<div id="screen1" class="screen active">
  <div class="btn" id="startBtn" aria-label="Start" role="button"></div>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen"></div>

<script>
  const startBtn = document.getElementById('startBtn');
  const screen1  = document.getElementById('screen1');
  const screen2  = document.getElementById('screen2');
  const body     = document.body;

  // Timings
  const debounceMs = 50;   // 0.05s pre-press lock
  const dblDelayMs = 100;  // 0.1s dbl-tap unlock
  const fadeDurMs  = 800;  // matches CSS --fade-dur
  const pressDurMs = 350;  // matches CSS --press-dur

  let allowDoubleTap = false;
  let startLocked    = false;

  // Prevent dragging / context menu
  startBtn.setAttribute('draggable', 'false');
  startBtn.addEventListener('contextmenu', (e) => e.preventDefault());

  // Start button
  startBtn.addEventListener('click', () => {
    if (startLocked) return;
    startLocked = true;

    setTimeout(() => {
      // Stronger glow + crossfade
      startBtn.classList.add('transitioning');
      body.classList.add('crossfade');

      screen2.classList.add('active');    // fade in
      screen1.classList.remove('active'); // fade out

      allowDoubleTap = false;
      setTimeout(() => { allowDoubleTap = true; }, dblDelayMs);

      // Reset state after transition
      setTimeout(() => {
        body.classList.remove('crossfade');
        startBtn.classList.remove('transitioning');
        startLocked = false;
      }, Math.max(fadeDurMs, pressDurMs) + 50);
    }, debounceMs);
  });

  // Double-tap to go back
  screen2.addEventListener('dblclick', () => {
    if (!allowDoubleTap) return;
    body.classList.add('crossfade');
    screen1.classList.add('active');
    screen2.classList.remove('active');
    setTimeout(() => { body.classList.remove('crossfade'); }, fadeDurMs + 50);
  });

  // PWA service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>

</body>
</html>
