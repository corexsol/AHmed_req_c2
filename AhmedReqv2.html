<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Hack4SaferPlates Screens</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="screen_one.png" />
<style>
  :root{
    --glow: 34,197,94;        /* #22c55e */
    --fade-dur: 800ms;        /* smoother crossfade */
    --glow-dur: 350ms;        /* glow ramp duration */
    --pulse-dur: 1300ms;      /* idle pulse */
    --easing: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

  /* Screens */
  .screen{
    position:fixed;inset:0;background:#fff;
    opacity:0;visibility:hidden;
    transition:opacity var(--fade-dur) var(--easing), visibility 0s linear var(--fade-dur);
    will-change:opacity;
  }
  .screen.active{
    opacity:1;visibility:visible;
    transition:opacity var(--fade-dur) var(--easing);
  }

  /* During crossfade keep both visible and block input for cleanliness */
  body.crossfade{pointer-events:none}
  body.crossfade .screen{visibility:visible}

  /* Backgrounds */
  #screen1{background:url('screen_1_NB.jpg') no-repeat center/cover}
  #screen2{background:url('screen_two.png') no-repeat center/cover;background-color:#fff}

  /* CTA Button */
  .btn{
    position:absolute;left:50%;bottom:15vh;transform:translateX(-50%) scale(1);
    width:25vw;max-width:200px;min-width:100px;border-radius:999px;cursor:pointer;z-index:20;
    animation:glowPulse var(--pulse-dur) ease-in-out infinite;
    transition:transform var(--glow-dur) var(--easing), box-shadow var(--glow-dur) var(--easing), filter var(--glow-dur) var(--easing);
    will-change:transform,box-shadow,filter;
  }
  .btn img{width:100%;height:auto;display:block;border-radius:inherit}

  /* Idle pulse (subtle) */
  @keyframes glowPulse{
    0%  {transform:translateX(-50%) scale(1);    box-shadow:0 0 0 0 rgba(var(--glow),.65)}
    35% {transform:translateX(-50%) scale(1.06); box-shadow:0 0 22px 12px rgba(var(--glow),.45)}
    65% {transform:translateX(-50%) scale(1.03); box-shadow:0 0 14px 8px  rgba(var(--glow),.28)}
    100%{transform:translateX(-50%) scale(1);    box-shadow:0 0 0 0 rgba(var(--glow),0)}
  }

  /* On press: smoothly ramp to a brighter, larger glow */
  .btn.transitioning{
    animation:none;
    transform:translateX(-50%) scale(1.18);
    box-shadow:0 0 80px 36px rgba(var(--glow),.95);
    filter:saturate(1.1);
  }

  /* Responsive */
  @media (max-width:1024px){
    .btn{width:35vw;max-width:250px;min-width:120px;bottom:12vh}
  }
  @media (prefers-reduced-motion:reduce){
    .btn{animation:none;transition:none}
    .screen,.screen.active{transition:none}
  }
</style>
</head>
<body>

<!-- Screen 1 -->
<div id="screen1" class="screen active">
  <div class="btn" id="startBtn">
    <img src="button.png" alt="Start" />
  </div>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen"></div>

<script>
  const startBtn = document.getElementById('startBtn');
  const screen1  = document.getElementById('screen1');
  const screen2  = document.getElementById('screen2');
  const body     = document.body;

  // timings
  const debounceMs   = 50;   // 0.05s: pre-press lock to prevent spam
  const dblDelayMs   = 100;  // 0.1s: enable dblclick back
  const fadeDurMs    = 800;  // must match --fade-dur
  const glowDurMs    = 350;  // must match --glow-dur

  let allowDoubleTap = false;
  let startLocked    = false;

  startBtn.addEventListener('click', () => {
    if (startLocked) return;
    startLocked = true;

    // small debounce before anim
    setTimeout(() => {
      // begin smooth glow-up AND start crossfade at the same time
      startBtn.classList.add('transitioning');
      body.classList.add('crossfade');

      // make screen2 visible for crossfade and fade screen1 out simultaneously
      screen2.classList.add('active');   // fades in
      screen1.classList.remove('active'); // fades out

      // enable dblclick shortly after
      allowDoubleTap = false;
      setTimeout(() => { allowDoubleTap = true; }, dblDelayMs);

      // after fade completes, clear crossfade/input lock and reset button state
      setTimeout(() => {
        body.classList.remove('crossfade');
        startBtn.classList.remove('transitioning');
        startLocked = false;
      }, Math.max(fadeDurMs, glowDurMs) + 50); // small buffer
    }, debounceMs);
  });

  // Return with double-tap from screen2
  screen2.addEventListener('dblclick', () => {
    if (!allowDoubleTap) return;

    // crossfade back
    body.classList.add('crossfade');
    screen1.classList.add('active');    // fade in
    screen2.classList.remove('active'); // fade out

    setTimeout(() => {
      body.classList.remove('crossfade');
    }, fadeDurMs + 50);
  });

  // PWA SW
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>

</body>
</html>
