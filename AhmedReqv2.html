<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hack4SaferPlates Screens</title>

<!-- Manifest & PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="transparent"> <!-- Android: edge-to-edge -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /> <!-- iOS: edge-to-edge -->
<link rel="apple-touch-icon" href="screen_one.png" />

<style>
  :root{
    --glow: 34,197,94;        /* #22c55e */
    --fade-dur: 800ms;
    --glow-dur: 350ms;
    --pulse-dur: 1300ms;
    --easing: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    background:#000; /* fallback behind images */
  }

  .screen{
    position:fixed;inset:0;background:#fff;
    opacity:0;visibility:hidden;
    transition:opacity var(--fade-dur) var(--easing), visibility 0s linear var(--fade-dur);
    will-change:opacity;
  }
  .screen.active{
    opacity:1;visibility:visible;
    transition:opacity var(--fade-dur) var(--easing);
  }
  body.crossfade{pointer-events:none}
  body.crossfade .screen{visibility:visible}

  #screen1{background:url('screen_1_NB.jpg') no-repeat center/cover}
  #screen2{background:url('screen_two.png') no-repeat center/cover;background-color:#fff}

  .btn{
    position:absolute;left:50%;bottom:15vh;
    transform:translateX(-50%) scale(1);
    width:25vw;max-width:200px;min-width:100px;
    border-radius:999px;cursor:pointer;z-index:20;
    animation:glowPulse var(--pulse-dur) ease-in-out infinite;
    transition:transform var(--glow-dur) var(--easing), box-shadow var(--glow-dur) var(--easing), filter var(--glow-dur) var(--easing);
    will-change:transform,box-shadow,filter;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .btn img{
    width:100%;height:auto;display:block;border-radius:inherit;
    -webkit-user-drag:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    pointer-events:none;
  }

  @keyframes glowPulse{
    0%  {transform:translateX(-50%) scale(1);    box-shadow:0 0 0 0 rgba(var(--glow),.65)}
    35% {transform:translateX(-50%) scale(1.06); box-shadow:0 0 22px 12px rgba(var(--glow),.45)}
    65% {transform:translateX(-50%) scale(1.03); box-shadow:0 0 14px 8px  rgba(var(--glow),.28)}
    100%{transform:translateX(-50%) scale(1);    box-shadow:0 0 0 0 rgba(var(--glow),0)}
  }

  .btn.transitioning{
    animation:none;
    transform:translateX(-50%) scale(1.18);
    box-shadow:0 0 80px 36px rgba(var(--glow),.95);
    filter:saturate(1.1);
  }

  /* Optional readability overlay for status bar area */
  .statusbar-shade {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top, 24px);
    background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0));
    pointer-events: none;
    z-index: 999;
  }

  @media (max-width:1024px){
    .btn{width:35vw;max-width:250px;min-width:120px;bottom:12vh}
  }
  @media (prefers-reduced-motion:reduce){
    .btn{animation:none;transition:none}
    .screen,.screen.active{transition:none}
  }
</style>
</head>
<body>

<!-- subtle shade so status text stays visible over bright images -->
<div class="statusbar-shade"></div>

<div id="screen1" class="screen active">
  <div class="btn" id="startBtn">
    <img src="button.png" alt="Start" />
  </div>
</div>

<div id="screen2" class="screen"></div>

<script>
  const startBtn = document.getElementById('startBtn');
  const screen1  = document.getElementById('screen1');
  const screen2  = document.getElementById('screen2');
  const body     = document.body;

  const debounceMs = 50;
  const dblDelayMs = 100;
  const fadeDurMs  = 800;
  const glowDurMs  = 350;

  let allowDoubleTap = false;
  let startLocked    = false;

  startBtn.addEventListener('click', () => {
    if (startLocked) return;
    startLocked = true;

    setTimeout(() => {
      startBtn.classList.add('transitioning');
      body.classList.add('crossfade');

      screen2.classList.add('active');
      screen1.classList.remove('active');

      allowDoubleTap = false;
      setTimeout(() => { allowDoubleTap = true; }, dblDelayMs);

      setTimeout(() => {
        body.classList.remove('crossfade');
        startBtn.classList.remove('transitioning');
        startLocked = false;
      }, Math.max(fadeDurMs, glowDurMs) + 50);
    }, debounceMs);
  });

  screen2.addEventListener('dblclick', () => {
    if (!allowDoubleTap) return;
    body.classList.add('crossfade');
    screen1.classList.add('active');
    screen2.classList.remove('active');
    setTimeout(() => { body.classList.remove('crossfade'); }, fadeDurMs + 50);
  });

  startBtn.addEventListener("contextmenu", (e) => e.preventDefault());

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>

</body>
</html>
