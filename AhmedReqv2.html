<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hack4SaferPlates Screens</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="screen_one.png">
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    width: 100vw;
    height: 100vh;
    overflow-y: auto;
  }
  .screen {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0;
    left: 0;
    background-color: white;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease-in-out;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    z-index: 10;
  }
  #screen1 {
    background: url('screen_1_NB.jpg') no-repeat center center/cover;
  }
  #screen2 {
    background: url('screen_two.png') no-repeat center center/cover;
    background-color: white;
  }
  .btn {
    position: absolute;
    bottom: 15vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    cursor: pointer;
    width: 25vw;
    max-width: 200px;
    min-width: 100px;
    animation: breathing 3s ease-in-out infinite;
  }
  .btn img {
    width: 100%;
    height: auto;
    display: block;
  }
  @keyframes breathing {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.1); }
  }

  /* Responsive adjustments for iPad and tablets */
  @media (max-width: 1024px) {
    .btn {
      width: 35vw;
      max-width: 250px;
      min-width: 120px;
      bottom: 12vh;
    }
  }

</style>
</head>
<body>

<div id="screen1" class="screen active">
  <!-- Screen one content -->
  <!-- Button will be attached here -->
  <div class="btn" id="startBtn">
    <img src="button.png" alt="Start Button">
  </div>
</div>

<div id="screen2" class="screen">
  <!-- Screen two content -->
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  let canGoBack = false;

  startBtn.addEventListener('click', () => {
    screen1.classList.remove('active');
    screen2.classList.add('active');
    canGoBack = false;
    setTimeout(() => {
      canGoBack = true;
    }, 2000);
  });

  screen2.addEventListener('dblclick', () => {
    if (!canGoBack) return;
    screen2.classList.remove('active');
    screen1.classList.add('active');
    canGoBack = false;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>

</body>
</html>
